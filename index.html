<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>语跃 LinguaLeap · 沉浸式多语种学习平台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>">
<style>
:root{
  --p1:#6366f1; --p2:#8b5cf6; --p3:#ec4899;
  --bg:#f3f5fb; --card:#ffffff; --ink:#1e2245; --sub:#69708c; --line:#e8eaf3;
  --ok:#10b981; --okbg:#e7f9f1; --warn:#f59e0b; --warnbg:#fef4e2; --bad:#ef4444; --badbg:#fdecec;
  --side1:#1d2040; --side2:#2b2f6e;
  --sh:0 8px 24px rgba(30,34,80,.08); --sh2:0 12px 32px rgba(30,34,80,.14);
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.hidden{display:none!important}
.muted{color:var(--sub)}
.small{font-size:12.5px}
.divider{height:1px;background:var(--line);margin:14px 0}
a{color:var(--p1);text-decoration:none}

/* ---------- 按钮与表单 ---------- */
.btn{border:none;border-radius:12px;padding:11px 20px;font-size:14.5px;font-weight:600;cursor:pointer;transition:.16s;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;box-shadow:0 6px 16px rgba(99,102,241,.35)}
.btn.pri:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(99,102,241,.42)}
.btn.soft{background:#eef0ff;color:#4c51d8}
.btn.soft:hover{background:#e3e6ff}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:#c9cdf0}
.btn.danger{background:var(--badbg);color:var(--bad)}
.btn.sm{padding:7px 14px;font-size:13px;border-radius:10px}
.btn.lg{padding:14px 28px;font-size:16px;border-radius:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink)}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font-size:14.5px;outline:none;transition:.15s;background:#fff;color:var(--ink)}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--p1);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.field textarea{resize:vertical;min-height:88px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13.5px;cursor:pointer;transition:.15s;user-select:none}
.chip:hover{border-color:#c9cdf0}
.chip.on{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(99,102,241,.3)}

/* ---------- 登录页 ---------- */
#auth-view{min-height:100vh;display:flex}
.auth-left{flex:1.15;position:relative;overflow:hidden;background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 48%,#c026d3 100%);display:flex;flex-direction:column;justify-content:center;padding:60px;color:#fff}
.auth-left::before,.auth-left::after{content:"";position:absolute;border-radius:50%;filter:blur(10px);opacity:.35}
.auth-left::before{width:420px;height:420px;background:#fff;top:-140px;right:-120px}
.auth-left::after{width:300px;height:300px;background:#f0abfc;bottom:-100px;left:-80px}
.brand{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:800;letter-spacing:.5px;z-index:2}
.brand .logo{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;font-size:28px}
.auth-slogan{font-size:40px;font-weight:800;line-height:1.3;margin:34px 0 16px;z-index:2}
.auth-desc{font-size:16.5px;opacity:.92;line-height:1.9;max-width:520px;z-index:2}
.auth-feats{margin-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:540px;z-index:2}
.auth-feat{background:rgba(255,255,255,.14);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:12px 16px;font-size:14px;display:flex;gap:9px;align-items:center}
.float-chip{position:absolute;padding:9px 18px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(8px);font-weight:700;font-size:15px;animation:floatY 4.5s ease-in-out infinite alternate;z-index:1}
@keyframes floatY{from{transform:translateY(-10px)}to{transform:translateY(12px)}}
.auth-right{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px;background:var(--bg)}
.auth-card{width:100%;max-width:430px;background:var(--card);border-radius:22px;box-shadow:var(--sh2);padding:36px 34px}
.auth-tabs{display:flex;background:#eef0f8;border-radius:12px;padding:4px;margin-bottom:24px}
.auth-tabs button{flex:1;border:none;background:transparent;padding:10px;border-radius:9px;font-size:14.5px;font-weight:600;color:var(--sub);cursor:pointer;transition:.15s}
.auth-tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(30,34,80,.1)}
.ava-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.ava-pick{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid var(--line);cursor:pointer;background:#fff;transition:.15s}
.ava-pick.on{border-color:var(--p1);background:#eef0ff;transform:scale(1.1)}
@media(max-width:920px){.auth-left{display:none}.auth-right{background:linear-gradient(135deg,#4f46e5,#7c3aed)}}

/* ---------- 应用框架 ---------- */
#app-view{display:flex;min-height:100vh}
.sidebar{width:236px;background:linear-gradient(180deg,var(--side1),var(--side2));color:#c6c9e8;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0;z-index:20}
.s-logo{display:flex;align-items:center;gap:10px;padding:22px 20px 18px;color:#fff;font-size:19px;font-weight:800}
.s-logo .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--p1),var(--p3));display:flex;align-items:center;justify-content:center;font-size:20px}
.s-nav{flex:1;padding:6px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.s-nav a{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:12px;color:#a9adcf;font-size:14.5px;font-weight:500;cursor:pointer;transition:.15s;user-select:none}
.s-nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.s-nav a.on{background:rgba(255,255,255,.14);color:#fff;font-weight:700}
.s-nav a .ic{font-size:17px;width:22px;text-align:center}
.s-nav .nav-sec{font-size:11px;color:#6b6f9c;padding:14px 14px 4px;letter-spacing:1px}
.s-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.09)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:64px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:15}
.tb-title{font-size:17px;font-weight:700}
.tb-right{display:flex;align-items:center;gap:12px}
.pill{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:700}
.tb-ava{width:40px;height:40px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 8px rgba(30,34,80,.15);cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#eef0ff,#fde7f3)}
.view{padding:26px 30px 60px;max-width:1180px;width:100%;margin:0 auto}
@media(max-width:900px){.sidebar{width:66px}.s-logo span,.s-nav a .txt,.nav-sec,.s-foot .s-user-info{display:none}.s-logo{justify-content:center;padding:18px 0}.s-nav a{justify-content:center}.s-foot{display:flex;justify-content:center}.view{padding:18px 14px 80px}}

/* ---------- 通用卡片/网格 ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:22px}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-h .t{font-size:16.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:1000px){.grid3,.grid4{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:560px){.grid3,.grid4{grid-template-columns:1fr}}
.stat-card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;display:flex;gap:14px;align-items:center}
.sc-ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0}
.sc-num{font-size:23px;font-weight:800;line-height:1.15}
.sc-label{font-size:12.5px;color:var(--sub)}
.bar{height:8px;background:#edeff8;border-radius:99px;overflow:hidden}
.bar-i{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--p1),var(--p2));transition:width .5s}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.hero-banner{background:linear-gradient(120deg,#5b5ef4 0%,#8b5cf6 55%,#c026d3 120%);border-radius:20px;color:#fff;padding:28px 30px;display:flex;align-items:center;justify-content:space-between;gap:20px;position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(99,102,241,.35)}
.hero-banner::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12);right:-60px;top:-110px}
.hero-banner h2{font-size:23px;font-weight:800;margin-bottom:8px}
.hero-banner p{opacity:.92;font-size:14px;line-height:1.7}
.ring-wrap{position:relative;width:92px;height:92px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(255,255,255,.25);stroke-width:9}
.ring-bg2{fill:none;stroke:#edeff8;stroke-width:9}
.ring-i{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring-i.dark{stroke:var(--p1)}
.ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:16px}

/* ---------- 课程库 ---------- */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{padding:9px 20px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-size:14px;font-weight:600;cursor:pointer;transition:.15s;color:var(--sub)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.level-block{margin-bottom:18px}
.level-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:18px 22px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh)}
.level-head .lv-badge{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff}
.lesson-row{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px 22px;margin-top:12px;transition:.16s}
.lesson-row:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.lr-icon{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:25px;background:#f0f2ff;flex-shrink:0}
.lr-main{flex:1;min-width:0}
.lr-title{font-weight:700;font-size:15.5px;margin-bottom:4px}
.module-dots{display:flex;gap:5px;margin-top:7px}
.md{width:26px;height:6px;border-radius:99px;background:#e5e8f5}
.md.done{background:var(--ok)}

/* ---------- 课程学习（闪卡/测验/口语/听力） ---------- */
.stage-wrap{max-width:640px;margin:0 auto}
.stage-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.stage-top .back{cursor:pointer;color:var(--sub);font-size:14px;font-weight:600;background:none;border:none}
.step-dots{display:flex;gap:6px}
.sd{width:34px;height:7px;border-radius:99px;background:#e2e5f4;font-size:0}
.sd.done{background:var(--p1)}
.sd.cur{background:linear-gradient(90deg,var(--p1),var(--p2))}
.fc-stage{perspective:1200px}
.fc{position:relative;height:320px;cursor:pointer;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,0,.2,1)}
.fc.flip{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;box-shadow:var(--sh2)}
.fc-face.front{background:linear-gradient(150deg,#ffffff,#f4f2ff);border:1px solid var(--line)}
.fc-face.back{background:linear-gradient(150deg,#5b5ef4,#8b5cf6 60%,#a855f7);color:#fff;transform:rotateY(180deg)}
.fc-lang{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--p2);text-transform:uppercase;margin-bottom:16px}
.fc-word{font-size:40px;font-weight:800;line-height:1.25;word-break:break-word}
.fc-word.ja,.fc-word.ko{font-size:34px}
.fc-hint{margin-top:18px;font-size:13px;color:#a0a4c8}
.fc-reading{font-size:19px;opacity:.9;margin:8px 0 18px;font-weight:600}
.fc-zh{font-size:26px;font-weight:800;margin-bottom:18px}
.fc-ex{background:rgba(255,255,255,.16);border-radius:12px;padding:12px 18px;font-size:14.5px;line-height:1.7}
.fc-actions{display:flex;gap:12px;margin-top:22px}
.fc-btn{flex:1;border:none;border-radius:14px;padding:15px 10px;font-size:15px;font-weight:700;cursor:pointer;color:#fff;transition:.15s}
.fc-btn:hover{transform:translateY(-2px)}
.fc-btn.red{background:linear-gradient(135deg,#f87171,#ef4444)}
.fc-btn.amber{background:linear-gradient(135deg,#fbbf24,#f59e0b)}
.fc-btn.green{background:linear-gradient(135deg,#34d399,#10b981)}
.snd-btn{width:46px;height:46px;border-radius:50%;border:none;background:#eef0ff;color:var(--p1);font-size:19px;cursor:pointer;transition:.15s;flex-shrink:0}
.snd-btn:hover{background:#e0e3ff;transform:scale(1.06)}
.q-card{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:26px}
.q-title{font-size:18px;font-weight:700;margin-bottom:18px;line-height:1.55}
.q-opt{border:2px solid var(--line);border-radius:14px;padding:13px 16px;margin-bottom:10px;cursor:pointer;font-size:15px;transition:.15s;background:#fff;display:flex;align-items:center;gap:10px}
.q-opt:hover{border-color:#c9cdf0}
.q-opt .ol{width:26px;height:26px;border-radius:8px;background:#f0f2fa;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--sub);flex-shrink:0}
.q-opt.ok{border-color:var(--ok);background:var(--okbg)}
.q-opt.bad{border-color:var(--bad);background:var(--badbg)}
.q-opt.dim{opacity:.55}
.q-opt.ok .ol,.q-opt.bad .ol{background:transparent}
.q-why{background:#f6f7fd;border-left:4px solid var(--p1);border-radius:10px;padding:11px 14px;font-size:13.5px;color:var(--sub);margin:12px 0;line-height:1.7}
.gram-card{background:linear-gradient(150deg,#fff,#f2f0ff);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--sh)}
.gram-card h3{font-size:19px;margin-bottom:12px;display:flex;gap:9px;align-items:center}
.gram-card .exp{font-size:15px;line-height:2;color:#3c4166;white-space:pre-line}
.speak-card{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:30px;text-align:center}
.sp-text{font-size:27px;font-weight:800;line-height:1.5;margin:18px 0 6px}
.sp-zh{color:var(--sub);font-size:14.5px;margin-bottom:22px}
.mic-btn{width:76px;height:76px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--p1),var(--p3));color:#fff;font-size:30px;cursor:pointer;box-shadow:0 10px 24px rgba(139,92,246,.4);transition:.2s;margin:0 auto}
.mic-btn:hover{transform:scale(1.07)}
.mic-btn.rec{animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(236,72,153,.5)}70%{box-shadow:0 0 0 18px rgba(236,72,153,0)}100%{box-shadow:0 0 0 0 rgba(236,72,153,0)}}
.sp-score{font-size:38px;font-weight:800;margin:10px 0}
.score-hip{font-size:14px;color:var(--sub)}

/* ---------- 进度页 ---------- */
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:290px}
.hm-cell{width:100%;aspect-ratio:1;border-radius:5px;background:#edeff8}
.hm-cell.l1{background:#dcd7fb}.hm-cell.l2{background:#b1a7f5}.hm-cell.l3{background:#8b78ee}.hm-cell.l4{background:#5b5ef4}
.legend{display:flex;gap:5px;align-items:center;font-size:12px;color:var(--sub);margin-top:10px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.chart-svg{width:100%;height:auto;display:block}

/* ---------- 学习路径 ---------- */
.road{position:relative;padding-left:34px}
.road::before{content:"";position:absolute;left:12px;top:8px;bottom:8px;width:3px;border-radius:3px;background:#e2e5f4}
.road-node{position:relative;margin-bottom:16px}
.rn-dot{position:absolute;left:-34px;top:16px;width:27px;height:27px;border-radius:50%;background:#d7dbef;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;z-index:2}
.road-node.done .rn-dot{background:var(--ok)}
.road-node.cur .rn-dot{background:linear-gradient(135deg,var(--p1),var(--p3));box-shadow:0 0 0 5px rgba(99,102,241,.18)}
.rn-card{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:15px 18px;display:flex;align-items:center;gap:14px}
.road-node.cur .rn-card{border:2px solid var(--p1)}
.rec-card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;display:flex;gap:14px;align-items:flex-start}
.rec-ic{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}

/* ---------- 社区 ---------- */
.post{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;margin-bottom:14px}
.p-head{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.p-ava{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#eef0ff,#fde7f3);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.p-name{font-weight:700;font-size:14.5px}
.p-time{font-size:12px;color:var(--sub)}
.p-body{font-size:14.5px;line-height:1.85;white-space:pre-wrap}
.p-actions{display:flex;gap:18px;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
.p-act{background:none;border:none;cursor:pointer;font-size:13.5px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:8px;transition:.15s}
.p-act:hover{background:#f2f4fc}
.p-act.on{color:var(--p3)}
.c-item{display:flex;gap:10px;margin-top:12px;font-size:13.5px}
.c-item .p-ava{width:32px;height:32px;font-size:16px}
.c-bubble{background:#f4f5fb;border-radius:4px 14px 14px 14px;padding:9px 13px;line-height:1.6}
.c-input{display:flex;gap:10px;margin-top:14px}
.c-input input{flex:1;border:1.5px solid var(--line);border-radius:999px;padding:9px 16px;font-size:13.5px;outline:none}
.c-input input:focus{border-color:var(--p1)}

/* ---------- 成就 ---------- */
.bd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}
.bd{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px 14px;text-align:center;transition:.16s}
.bd .bd-icon{font-size:38px;filter:grayscale(1);opacity:.35;margin-bottom:10px}
.bd.on{border:2px solid #ffd66b}
.bd.on .bd-icon{filter:none;opacity:1;animation:pop .45s}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.bd .bd-name{font-weight:700;font-size:14px;margin-bottom:5px}
.bd .bd-desc{font-size:12px;color:var(--sub);line-height:1.5}
.lb-row{display:flex;align-items:center;gap:12px;padding:11px 8px;border-bottom:1px solid var(--line)}
.lb-row:last-child{border-bottom:none}
.lb-rank{width:26px;font-weight:800;font-size:15px;color:var(--sub);text-align:center}
.lb-rank.r1{color:#f59e0b}.lb-rank.r2{color:#8a93b2}.lb-rank.r3{color:#c47f3e}

/* ---------- 模态框/提示 ---------- */
.overlay{position:fixed;inset:0;background:rgba(24,27,58,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:22px;box-shadow:0 24px 64px rgba(20,22,60,.35);padding:30px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;animation:mup .25s}
.modal-lg{max-width:640px}
@keyframes mup{from{transform:translateY(22px);opacity:0}to{transform:none;opacity:1}}
.toast-root{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
.toast{background:#262a4f;color:#fff;padding:12px 22px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(20,22,60,.35);animation:tin .3s;display:flex;gap:8px;align-items:center;max-width:86vw}
.toast.ok{background:linear-gradient(135deg,#0ea36f,#10b981)}
.toast.bad{background:linear-gradient(135deg,#ef4444,#f97316)}
.toast.gold{background:linear-gradient(135deg,#f59e0b,#f97316);box-shadow:0 10px 30px rgba(245,158,11,.5)}
@keyframes tin{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
.cf{position:fixed;top:-16px;z-index:300;border-radius:3px;pointer-events:none;animation:cfall linear forwards}
@keyframes cfall{to{transform:translateY(105vh) rotate(720deg);opacity:.6}}
.empty{text-align:center;padding:46px 20px;color:var(--sub)}
.empty .e-ic{font-size:44px;margin-bottom:12px}
.fade-in{animation:fin .3s}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>

function timeAgo(ts){

  }
  const diff=Date.now()-ts;
  if(diff<60000) return '刚刚';
  if(diff<3600000) return Math.floor(diff/60000)+' 分钟前';
  if(diff<86400000) return Math.floor(diff/3600000)+' 小时前';
  if(diff<86400000*7) return Math.floor(diff/86400000)+' 天前';

}

/* ---------- 语音：TTS / 语音识别 ---------- */
const TTS_OK=('speechSynthesis' in window);
function speak(text,lang,rate){
  return new Promise(res=>{
    if(!TTS_OK){ toast('当前浏览器不支持语音合成','bad'); return res(); }
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.lang=lang||'en-US'; u.rate=rate||0.92;
      let done=false; const fin=()=>{ if(!done){ done=true; res(); } };
      u.onend=fin; u.onerror=fin; setTimeout(fin,9000);
      speechSynthesis.speak(u);
    }catch(e){ res(); }
  });
}
const SR_Ctor=window.SpeechRecognition||window.webkitSpeechRecognition;
function recogOnce(lang){
  return new Promise((res,rej)=>{
    if(!SR_Ctor){ rej(new Error('no-sr')); return; }
    try{
      const r=new SR_Ctor(); r.lang=lang||'en-US'; r.interimResults=false; r.maxAlternatives=3;
      let got=false;
      r.onresult=e=>{ got=true; const alts=[]; for(let i=0;i<e.results[0].length;i++) alts.push(e.results[0][i].transcript); res(alts); };
      r.onerror=e=>{ rej(new Error(e.error||'sr-error')); };
      r.onend=()=>{ if(!got) rej(new Error('no-speech')); };
      r.start();
    }catch(e){ rej(e); }
  });
}
/* 相似度：字符级 Levenshtein */
function similarity(a,b){
  a=String(a).toLowerCase().replace(/[.,!?~;:'"()\[\]、。！？，；：''""…—·\s]/g,'');
  b=String(b).toLowerCase().replace(/[.,!?~;:'"()\[\]、。！？，；：''""…—·\s]/g,'');
  if(!a||!b) return 0;
  if(a===b) return 100;
  const m=a.length,n=b.length, dp=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return Math.max(0,Math.round((1-dp[m][n]/Math.max(m,n))*100));
}

function addXP(n,reason){
  const p=P(); p.xp+=n;
  p.history[today()]=(p.history[today()]||0)+n;
  // 连续打卡
  if(p.streak.last!==today()){
    p.streak.c=(p.streak.last===yesterday())?p.streak.c+1:1;
    p.streak.last=today();
  }
  saveP(); refreshTopbar();
  if(reason) toast('+'+n+' XP · '+reason,'ok','⚡');
  checkBadges();
}
function recordStat(mod,correct){
  const s=P().stats[mod]; s.a++; if(correct) s.c++; saveP();
}
function findLesson(lid){
  for(const lg of LKEYS) for(let li=0;li<COURSES[lg].length;li++)
    for(let oi=0;oi<COURSES[lg][li].length;oi++)
      if(COURSES[lg][li][oi].id===lid) return {lang:lg,lv:li,idx:oi,lesson:COURSES[lg][li][oi]};
  return null;
}
function lessonDone(lid){ const l=P().lessons[lid]; return l&&l.done; }
function setModuleScore(lid,mod,scorePct){
  const p=P(); if(!p.lessons[lid]) p.lessons[lid]={vocab:0,grammar:0,speak:0,listen:0,done:false};
  p.lessons[lid][mod]=Math.max(p.lessons[lid][mod]||0,Math.round(scorePct));
  const les=p.lessons[lid];
  const all=['vocab','grammar','speak','listen'].every(m=>les[m]>0);
  let firstDone=false;
  if(all&&!les.done){ les.done=true; firstDone=true; }
  saveP(); return firstDone;
}
function upsertSRS(items,lang,lid){
  const p=P();
  items.forEach(v=>{
    const key=v.w+'|'+lid;
    if(!p.srs.some(s=>s.w+'|'+s.lid===key)){
      p.srs.push({w:v.w,r:v.r,zh:v.zh,ex:v.ex,exZh:v.exZh,lang,lid,box:0,next:addDays(1)});
    }
  });
  saveP();
}
function reviewSRS(word,ok){
  const item=P().srs.find(s=>s.w===word.w&&s.lid===word.lid);
  if(!item) return;
  if(ok){ item.box=Math.min(item.box+1,4); item.next=addDays([1,2,4,7,15][item.box]); }
  else { item.box=0; item.next=addDays(1); }
  saveP();
}
function dueReviews(){ const t=today(); return P().srs.filter(s=>s.next<=t); }
function accOf(mod){ const s=P().stats[mod]; return s.a?s.c/s.a:0; }
function wordsLearned(){ return P().srs.length; }
function lessonsDoneCount(){ return Object.values(P().lessons).filter(l=>l.done).length; }
function langProgress(lang){
  const lv=P().curLevel[lang]||0;
  const lessons=COURSES[lang][lv]||[];
  const done=lessons.filter(l=>lessonDone(l.id)).length;
  return {lv,done,total:lessons.length,pct:pct(done,lessons.length)};
}
</script>

function hashPwd(p){ let h=0; for(let i=0;i<p.length;i++){ h=(h<<5)-h+p.charCodeAt(i); h|=0; } return 'h'+h; }
function doRegister(name,email,pwd,avatar,langs,silent){

  const u={uid:uid(),name,email,pwd:hashPwd(pwd),avatar,langs,created:Date.now()};
  users[email]=u; DB.set('users',users);
  DB.set('prog_'+u.uid,newProgress());
  if(!silent) toast('注册成功，欢迎加入语跃！','ok','🎉');
  setSession(u);
}
function login(email,pwd){
  const users=DB.get('users',{});
  const u=users[email];
  if(!u||u.pwd!==hashPwd(pwd)){ toast('邮箱或密码错误','bad'); return; }
  toast('欢迎回来，'+u.name+'！','ok','👋');
  setSession(u);
}
function setSession(u){

}

function ringSvg(p,dark,size){
  size=size||92; const r=(size-14)/2, c=2*Math.PI*r, off=c*(1-Math.min(1,p));
  return `<div class="ring-wrap" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}">
      <circle class="${dark?'ring-bg2':'ring-bg'}" cx="${size/2}" cy="${size/2}" r="${r}"></circle>
      <circle class="ring-i ${dark?'dark':''}" cx="${size/2}" cy="${size/2}" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${off}"></circle>
    </svg>
    <div class="ring-txt" style="${dark?'color:var(--ink)':''}">${Math.round(p*100)}<span style="font-size:11px">%</span></div>
  </div>`;
}

function renderVocab(){
  const S=LS, v=S.lesson.vocab[S.vi], total=S.lesson.vocab.length;

}
function vocabAnswer(kind){
  const S=LS, v=S.lesson.vocab[S.vi];

/* ---------- 模块 2：语法练习 ---------- */
function renderGrammar(){
  const S=LS, les=S.lesson, gp=les.grammar.length, qs=les.quiz.length;

function grammarPick(i){

function grammarNext(){ LS.gi++; LS.gSel=null; renderView(); }
function renderGrammarSummary(){

/* ---------- 模块 3：口语跟读 ---------- */
function renderSpeak(){
  const S=LS, items=S.lesson.speak;
  if(S.si>=items.length) return renderSpeakSummary();
  const s=items[S.si];
  const showRes=S.lastScore!==undefined;
  return `<div class="fade-in">
    <div class="stage-top" style="margin-top:4px">
      <span class="small muted">🎤 跟读 ${S.si+1} / ${items.length}</span>
      <div style="width:200px"><div class="bar"><div class="bar-i" style="width:${pct(S.si,items.length)}%"></div></div></div>
    </div>

      <div class="muted small">请先听示范，然后大声跟读</div>
      <div class="sp-text ${lsWordClass()}">${esc(s.t)}</div>
      <div class="sp-zh">${esc(s.zh)}</div>

        <button class="btn soft" onclick="speakLS('s',0.82)">🔊 听示范</button>

      <div id="sp-area" style="margin-top:26px">
        ${showRes?`
          <div class="sp-score" style="color:${S.lastScore>=80?'var(--ok)':S.lastScore>=60?'var(--warn)':'var(--bad)'}">${S.lastScore} 分</div>

          ${S.lastScore>=60||S.tried>=2?
            `<button class="btn pri" onclick="speakNext()">${S.si+1<items.length?'下一句 →':'完成口语练习'}</button>`:
            `<div style="display:flex;gap:10px;justify-content:center">
              <button class="btn ghost" onclick="LS.lastScore=undefined;LS.tried=(LS.tried||0)+1;renderView()">🎤 再试一次</button>
              <button class="btn soft" onclick="speakSelf(0)">跳过这句</button>
            </div>`}
        `:`
          <button class="mic-btn" id="mic" title="点击开始跟读">🎤</button>
          <div class="small muted" style="margin-top:12px" id="mic-hint">${SR_Ctor?'点击麦克风，朗读上面的句子':'当前浏览器不支持语音识别，已启用自评模式（建议用 Chrome 获得评分）'}</div>
          ${SR_Ctor?'':'<div style="display:flex;gap:10px;justify-content:center;margin-top:16px"><button class="btn pri" onclick="speakSelf(1)">😄 读得很棒</button><button class="btn ghost" onclick="speakSelf(0)">😅 还需练习</button></div>'}
        `}
      </div>
    </div>
  </div>`;
}
function bindSpeak(){
  const mic=EL('mic'); if(!mic) return;
  mic.onclick=async()=>{
    mic.classList.add('rec'); EL('mic-hint').textContent='正在聆听……请朗读句子';
    try{
      const alts=await recogOnce(lsTts());
      mic.classList.remove('rec');
      const target=LS.lesson.speak[LS.si].t;
      let best=0; alts.forEach(a=>{ best=Math.max(best,similarity(target,a)); });
      LS.lastScore=Math.max(best, best>0?0:5); LS.tried=(LS.tried||0)+1;
      const ok=LS.lastScore>=60; recordStat('speak',ok); if(ok) addXP(XP_PER.speak,'口语跟读');
      renderView();
    }catch(e){
      mic.classList.remove('rec');
      if(e.message==='no-sr'||e.message==='not-allowed'||e.message==='service-not-allowed'){ LS.spSelfRate=true; }
      toast('未捕获到语音，试试自评模式','bad','🎙️');
      LS.lastScore=undefined; renderView();
    }
  };
}
function speakSelf(ok){
  const S=LS;
  recordStat('speak',ok);
  S.lastScore=ok?88:45; S.tried=(S.tried||0)+1;
  if(ok) addXP(Math.round(XP_PER.speak*0.8),'口语跟读');
  renderView();
}
function speakNext(){
  const S=LS;
  S.spScores.push(S.lastScore||0);
  S.si++; S.lastScore=undefined; S.tried=0; renderView();
}

  const S=LS, avg=Math.round(S.spScores.reduce((a,b)=>a+b,0)/S.spScores.length);

      <button class="btn pri" onclick="LS.step='menu';renderView()">返回课程目录</button>
    </div>

function renderListen(){
  const S=LS, items=S.lesson.listen;
  if(S.li>=items.length) return renderListenSummary();
  const it=items[S.li];
  const opts=it.opts.map((o,i)=>`<div class="q-opt ${S.lSel!==null?(i===it.a?'ok':(i===S.lSel?'bad':'dim')):''}" ${S.lSel===null?`onclick="listenPick(${i})"`:''}>

  return `<div class="fade-in">
    <div class="stage-top" style="margin-top:4px">

        <button class="btn pri" onclick="speakLS('l',0.9)">▶️ 播放</button>

      <div style="text-align:left">${opts}</div>
      ${S.lSel!==null?`<div class="q-why" style="text-align:left">${S.lSel===it.a?'✅ 回答正确！':'❌ 正确答案是「'+esc(it.opts[it.a])+'」。'}原文：${esc(it.t)}（${esc(it.zh)}）</div>
      <div style="text-align:right"><button class="btn pri" onclick="listenNext()">${S.li+1<items.length?'下一题 →':'查看结果'}</button></div>`:''}

function listenPick(i){

}
function listenNext(){ LS.li++; LS.lSel=null; renderView(); }
function renderListenSummary(){
  const S=LS, n=S.lesson.listen.length, score=Math.round(S.lCorrect/n*100);

}

function findNextLesson(){

function bindStep(){

}

/* ================= 单词复习（间隔重复） ================= */
let RS=null;

function reviewAnswer(ok){

<script>
/* ================= 图表（纯 SVG） ================= */
function lineChartSvg(){
  const days=[]; for(let i=13;i>=0;i--){ const d=daysAgo(i); days.push({d,v:(P().history[d]||0)}); }
  const W=660,H=220,pL=36,pB=28,pT=16,pR=14;
  const max=Math.max(40,...days.map(x=>x.v));
  const px=i=>pL+i*(W-pL-pR)/13;
  const py=v=>pT+(H-pT-pB)*(1-v/max);
  const pts=days.map((x,i)=>px(i)+','+py(x.v)).join(' ');
  const area='M'+px(0)+','+(H-pB)+' L'+days.map((x,i)=>px(i)+','+py(x.v)).join(' L ')+' L'+px(13)+','+(H-pB)+' Z';
  const grid=[0,0.5,1].map(g=>{ const y=py(max*g);
    return `<line x1="${pL}" y1="${y}" x2="${W-pR}" y2="${y}" stroke="#e8eaf3" stroke-dasharray="4 4"/>
    <text x="${pL-8}" y="${y+4}" text-anchor="end" font-size="10" fill="#9aa0c0">${Math.round(max*g)}</text>`; }).join('');
  const labels=days.map((x,i)=> i%2===0?`<text x="${px(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#9aa0c0">${x.d.slice(5)}</text>`:'').join('');
  const dots=days.map((x,i)=>`<circle cx="${px(i)}" cy="${py(x.v)}" r="3.2" fill="#fff" stroke="#6366f1" stroke-width="2"><title>${x.d}：${x.v} XP</title></circle>`).join('');
  return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".28"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    <path d="${area}" fill="url(#lg)"/>
    <polyline points="${pts}" fill="none" stroke="#6366f1" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${labels}
  </svg>`;
}
function heatmapSvg(){
  let cells='';
  for(let i=27;i>=0;i--){
    const d=daysAgo(i), v=P().history[d]||0;
    const lv=v===0?0:v<20?1:v<40?2:v<70?3:4;
    cells+=`<div class="hm-cell l${lv}" title="${d}：${v} XP"></div>`;
  }
  return `<div class="hm">${cells}</div>
  <div class="legend">少 <i style="background:#edeff8"></i><i style="background:#dcd7fb"></i><i style="background:#b1a7f5"></i><i style="background:#8b78ee"></i><i style="background:#5b5ef4"></i> 多</div>`;
}

/* ================= 学习进度页 ================= */
function renderProgress(){
  const p=P(), u=me();

  return `
  <div class="grid4" style="margin-bottom:18px">

    <div class="stat-card"><div class="sc-ic" style="background:#eef0ff">🎓</div><div><div class="sc-num">Lv.${lv}</div><div class="sc-label">${p.xp} / ${nxt} XP</div></div></div>
    <div class="stat-card"><div class="sc-ic" style="background:var(--okbg)">📚</div><div><div class="sc-num">${wordsLearned()}</div><div class="sc-label">掌握单词</div></div></div>
    <div class="stat-card"><div class="sc-ic" style="background:#fde7f3">🏅</div><div><div class="sc-num">${lessonsDoneCount()}</div><div class="sc-label">完成课程</div></div></div>
  </div>
  <div class="card" style="margin-bottom:18px">
    <div class="card-h"><div class="t">📈 近 14 天学习曲线</div><span class="small muted">每日获得 XP</span></div>
    ${lineChartSvg()}
  </div>
  <div class="grid2" style="margin-bottom:18px">
    <div class="card">
      <div class="card-h"><div class="t">🗓️ 学习热力图</div><span class="small muted">最近 28 天</span></div>
      ${heatmapSvg()}
      <div class="divider"></div>
      <div style="display:flex;align-items:center;gap:14px">
        <div style="flex:1">
          <div class="small muted" style="margin-bottom:6px">等级进度 Lv.${lv} → Lv.${lv+1}</div>
          <div class="bar" style="height:10px"><div class="bar-i" style="width:${pct(p.xp-prev,nxt-prev)}%"></div></div>
        </div>
        <div class="small" style="font-weight:700">${pct(p.xp-prev,nxt-prev)}%</div>
      </div>
    </div>
    <div class="card">
      <div class="card-h"><div class="t">🎯 四大模块正确率</div></div>
      ${modAcc.map(m=>{ const s=p.stats[m[0]]; const a=s.a?Math.round(s.c/s.a*100):0;
        return `<div style="margin-bottom:16px">
          <div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px"><span>${m[1]}</span><span class="muted small">${a}% · ${s.a} 题</span></div>
          <div class="bar"><div class="bar-i" style="width:${a}%;background:${m[2]}"></div></div>
        </div>`; }).join('')}
      <div class="small muted" style="margin-top:4px">正确率低于 75% 的模块会出现在你的每日推荐中</div>
    </div>
  </div>
  <div class="card">
    <div class="card-h"><div class="t">🌍 各语言进度</div><a class="small" style="cursor:pointer" onclick="go('courses')">去上课 →</a></div>
    <div class="grid3">
      ${LKEYS.map(k=>{
        const lp=langProgress(k), LG=LANGS[k];
        const anyDone=LKEYS.some(()=>Object.keys(p.lessons).some(lid=>lid.startsWith(k)));
        return `<div style="border:1px solid var(--line);border-radius:14px;padding:16px">
          <div style="font-size:24px">${LG.flag}</div>

          <div class="small muted" style="margin-bottom:10px">${LG.levels[lp.lv].label} · 完成 ${lp.done}/${lp.total} 课</div>
          <div class="bar"><div class="bar-i" style="width:${lp.pct}%;background:${LG.levels[lp.lv].color}"></div></div>
        </div>`; }).join('')}
    </div>
  </div>`;
}

/* ================= 个性化推荐引擎 ================= */
function buildRecs(){
  const p=P(), u=me(), recs=[];
  const langs=(u.langs&&u.langs.length?u.langs:LKEYS.slice(0,1));
  // 1) 待复习单词（间隔重复到期）
  const due=dueReviews();
  if(due.length) recs.push({icon:'🔔',bg:'#fef4e2',lid:null,title:'复习 '+due.length+' 个单词',desc:'记忆曲线显示这批单词快忘了，趁现在巩固一下',btn:'去复习',action:'startReview()'});
  // 2) 薄弱模块强化
  const modsMeta={vocab:['单词记忆','🃏',0],grammar:['语法练习','✍️','#eef0ff'],speak:['口语跟读','🎤','#fde7f3'],listen:['听力训练','🎧','#fef4e2']};
  const weak=MODS.map(m=>({m,acc:accOf(m),a:p.stats[m].a})).filter(x=>x.a>=5&&x.acc<0.75).sort((x,y)=>x.acc-y.acc)[0];
  if(weak){
    const cand=langs.map(lg=>{ const lp=langProgress(lg); return (COURSES[lg][lp.lv]||[]).find(l=>!lessonDone(l.id)); }).find(Boolean)||COURSES.en[0][0];
    recs.push({icon:modsMeta[weak.m][1],bg:modsMeta[weak.m][2],lid:cand.id,title:'强化'+modsMeta[weak.m][0],desc:'你的'+modsMeta[weak.m][0]+'正确率 '+Math.round(weak.acc*100)+'%，推荐通过「'+cand.title+'」针对性练习',btn:'去强化',action:`startLesson('${cand.id}','${weak.m}')`});
  }
  // 3) 继续未完成的课 / 下一课
  langs.forEach(lg=>{
    const placed=p.placement[lg];
    if(placed===undefined){
      recs.push({icon:'🎯',bg:'#eef0ff',lid:null,title:LANGS[lg].name+'定级测试',desc:'花 1 分钟测一测，从最适合你的级别开始',btn:'去测试',action:`openPlacement('${lg}')`});
    }
    const lp=langProgress(lg);
    const lessons=COURSES[lg][lp.lv]||[];
    const nextLes=lessons.find(l=>!lessonDone(l.id));
    if(nextLes){
      const partial=p.lessons[nextLes.id]&&MODS.some(m=>p.lessons[nextLes.id][m]>0);
      recs.push({icon:nextLes.icon,bg:'#e7f9f1',lid:nextLes.id,title:(partial?'继续学习：':'新课：')+nextLes.title,desc:LANGS[lg].flag+' '+LANGS[lg].levels[lp.lv].label+' · '+nextLes.desc,btn:partial?'继续':'开始学',action:`startLesson('${nextLes.id}')`});
    }else if(lp.lv+1<COURSES[lg].length){
      recs.push({icon:'🚀',bg:'#eef0ff',lid:null,title:'冲击 '+LANGS[lg].levels[lp.lv+1].label+'！',desc:'恭喜，当前级别课程已全部完成，是时候进阶了',btn:'去进阶',action:`go('courses')`});
    }
  });
  // 4) 今日打卡提醒
  if(p.streak.last!==today()&&(p.streak.c>0||p.history[today()]===undefined)&&recs.length<6){
    recs.push({icon:'🔥',bg:'#fde7f3',lid:null,title:'保持连续打卡 '+p.streak.c+' 天',desc:'每天进步一点点，打断就可惜啦，从一节小课开始',btn:'去学习',action:`continueLesson()`});
  }
  return recs.slice(0,6);
}

/* ================= 学习路径页 ================= */
function renderPath(){
  const p=P(), u=me();
  const langs=(u.langs&&u.langs.length?u.langs:LKEYS.slice(0,1));
  const recs=buildRecs();
  const due=dueReviews();
  let html=`<div class="grid2" style="margin-bottom:18px">
    <div class="card">
      <div class="card-h"><div class="t">🧠 今日复习队列</div><span class="tag" style="background:#fef4e2;color:var(--warn)">间隔重复</span></div>
      ${due.length?`<p class="muted small" style="margin-bottom:12px">有 ${due.length} 个单词到了最佳复习时间点，别让它们溜走～</p>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px">${due.slice(0,8).map(w=>`<span class="chip" style="cursor:default">${LANGS[w.lang].flag} ${esc(w.w)}</span>`).join('')}${due.length>8?'<span class="chip" style="cursor:default">+'+(due.length-8)+'</span>':''}</div>
        <button class="btn pri" onclick="startReview()">开始复习（约 ${Math.ceil(due.length*0.5)} 分钟）</button>`
      :`<div class="empty" style="padding:20px"><div class="e-ic">✅</div>复习队列已清空，去学点新单词吧！</div>`}
    </div>
    <div class="card">
      <div class="card-h"><div class="t">✨ 为你推荐</div></div>
      ${recs.map(r=>`<div class="rec-card" style="margin-bottom:10px">
        <div class="rec-ic" style="background:${r.bg}">${r.icon}</div>
        <div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14px;margin-bottom:2px">${r.title}</div><div class="small muted">${r.desc}</div></div>
        <button class="btn soft sm" onclick="${r.action}">${r.btn}</button>
      </div>`).join('')}
    </div>
  </div>`;
  langs.forEach(lg=>{
    const LG=LANGS[lg], lv=p.curLevel[lg]||0, lessons=COURSES[lg][lv]||[];
    const placed=p.placement[lg];
    const firstUndone=lessons.find(l=>!lessonDone(l.id));
    html+=`<div class="card" style="margin-bottom:18px">
      <div class="card-h">
        <div class="t">${LG.flag} ${LG.name} · ${LG.levels[lv].label} 学习路线</div>
        ${placed===undefined?`<button class="btn soft sm" onclick="openPlacement('${lg}')">🎯 定级测试</button>`:
          `<span class="tag" style="background:#eef0ff;color:var(--p1)">定级：${LG.levels[placed].label}</span>`}
      </div>
      <div class="road">
        ${lessons.map((l,i)=>{
          const done=lessonDone(l.id);
          const cur=!done&&firstUndone&&l.id===firstUndone.id;
          return `<div class="road-node ${done?'done':cur?'cur':''}">
            <div class="rn-dot">${done?'✔':i+1}</div>
            <div class="rn-card">
              <div class="lr-icon" style="width:44px;height:44px;font-size:21px">${l.icon}</div>
              <div style="flex:1;min-width:0">
                <div style="font-weight:700;font-size:14.5px">${esc(l.title)}</div>
                <div class="small muted">${l.desc}</div>
              </div>
              ${done?'<span class="tag" style="background:var(--okbg);color:var(--ok)">已完成</span>':
                `<button class="btn ${cur?'pri':'soft'} sm" onclick="startLesson('${l.id}')">${cur?'▶ 继续学习':'预习'}</button>`}
            </div>
          </div>`; }).join('')}
        ${lv+1<COURSES[lg].length?`<div class="road-node"><div class="rn-dot">🔒</div>
          <div class="rn-card" style="opacity:.65"><div class="lr-icon" style="width:44px;height:44px;font-size:21px">🚀</div>
          <div style="flex:1"><div style="font-weight:700;font-size:14.5px">进阶：${LG.levels[lv+1].label}</div><div class="small muted">完成当前级别全部课程后解锁</div></div></div></div>`:''}
      </div>
    </div>`;
  });
  return html;
}
function bindPath(){}

/* ================= 定级测试 ================= */
let PT=null;
function openPlacement(lang){
  PT={lang,i:0,correct:0};
  renderPlacementQ();
}
function renderPlacementQ(){
  const qs=PLACEMENT[PT.lang], q=qs[PT.i];
  openModal(`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
      <div style="font-weight:800;font-size:16px">🎯 ${LANGS[PT.lang].name}定级测试</div>
      <button class="btn ghost sm" onclick="closeModal()">✕</button>
    </div>
    <div class="bar" style="margin-bottom:18px"><div class="bar-i" style="width:${pct(PT.i,qs.length)}%"></div></div>
    <div class="small muted" style="margin-bottom:8px">第 ${PT.i+1} 题 / ${qs.length} 题</div>
    <div class="q-title">${esc(q.q)}</div>
    ${q.opts.map((o,i)=>`<div class="q-opt" onclick="placePick(${i})"><span class="ol">${'ABC'[i]}</span>${esc(o)}</div>`).join('')}
  `,'modal-lg');
}
function placePick(i){
  const qs=PLACEMENT[PT.lang];
  if(i===qs[PT.i].a) PT.correct++;
  PT.i++;
  if(PT.i<qs.length) renderPlacementQ(); else placeResult();
}
function placeResult(){
  const lang=PT.lang, score=PT.correct, n=PLACEMENT[lang].length;
  const lv=score>=Math.ceil(n*0.85)?2:score>=Math.ceil(n*0.5)?1:0;
  const p=P();
  p.placement[lang]=lv; p.curLevel[lang]=lv; saveP();
  courseTab.open[lang]=lv;
  openModal(`
    <div style="text-align:center;padding:10px 0">
      <div style="font-size:54px">🎯</div>
      <h3 style="font-size:20px;margin:12px 0 6px">测试完成！</h3>
      <p class="muted" style="margin-bottom:14px">答对 ${score} / ${n} 题</p>
      <div style="background:linear-gradient(135deg,#eef0ff,#fdeef8);border-radius:16px;padding:20px;margin-bottom:20px">
        <div class="small muted" style="margin-bottom:6px">为你推荐的起点级别</div>
        <div style="font-size:22px;font-weight:800">${LANGS[lang].flag} ${LANGS[lang].levels[lv].label}</div>
        <div class="small muted" style="margin-top:8px">${lv===0?'别担心，每个高手都是从零开始的，我们会陪你打好地基 💪':lv===1?'有不错的底子！我们略过最基础的内容，直接进入正题':'底子很扎实！建议快速过一遍低级别内容查漏补缺，主攻进阶'}</div>
      </div>
      <button class="btn pri lg" onclick="closeModal();go('courses')">去上 ${LANGS[lang].levels[lv].label} 的课 →</button>
    </div>
  `);
  confetti();
}

/* ================= 社区 ================= */
function getPosts(){
  let posts=DB.get('posts',null);
  if(!posts){
    posts=SEED_POSTS.map(s=>({id:s.id,name:s.name,avatar:s.avatar,tag:s.tag,text:s.text,ts:s.ts,likes:s.likes,likedBy:[],comments:s.comments||[]}));
    DB.set('posts',posts);
  }
  return posts;
}
function savePosts(list){ DB.set('posts',list); }
const POST_TAGS=['#学习打卡','#方法分享','#求助提问','#资源推荐','#闲聊灌水'];
let cTag=POST_TAGS[0];
function renderCommunity(){
  const u=me(), posts=getPosts();
  return `
  <div class="card" style="margin-bottom:18px">
    <div style="display:flex;gap:12px">
      <div class="p-ava">${u.avatar}</div>
      <div style="flex:1">
        <textarea id="c-text" placeholder="分享你的学习心得、打卡成果，或者提个问题……" maxlength="500"></textarea>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap;gap:10px">
          <div class="chips">${POST_TAGS.map(t=>`<span class="chip ${t===cTag?'on':''}" data-tag="${t}" onclick="pickTag('${t}')">${t}</span>`).join('')}</div>
          <button class="btn pri" onclick="publishPost()">✍️ 发布</button>
        </div>
      </div>
    </div>
  </div>
  ${posts.map(p=>{
    const liked=p.likedBy.includes(u.uid);
    return `<div class="post">
      <div class="p-head">
        <div class="p-ava">${p.avatar}</div>
        <div style="flex:1"><div class="p-name">${esc(p.name)}</div><div class="p-time">${timeAgo(p.ts)}</div></div>
        <span class="tag" style="background:#eef0ff;color:var(--p1)">${p.tag}</span>
      </div>
      <div class="p-body">${esc(p.text)}</div>
      <div class="p-actions">
        <button class="p-act ${liked?'on':''}" onclick="toggleLike('${p.id}')">${liked?'❤️':'🤍'} ${p.likes} 点赞</button>
        <button class="p-act" onclick="focusComment('${p.id}')">💬 ${p.comments.length} 评论</button>
      </div>
      ${p.comments.map(c=>`<div class="c-item"><div class="p-ava">${c.avatar}</div>
        <div><span style="font-weight:700">${esc(c.name)}</span><div class="c-bubble">${esc(c.text)}</div></div></div>`).join('')}
      <div class="c-input">
        <input id="ci-${p.id}" placeholder="友善评论，鼓励他人~" maxlength="140" onkeydown="if(event.key==='Enter')commentPost('${p.id}')">
        <button class="btn soft sm" onclick="commentPost('${p.id}')">发送</button>
      </div>
    </div>`; }).join('')}`;
}
function pickTag(t){ cTag=t; renderView(); }
function bindCommunity(){}
function publishPost(){
  const txt=EL('c-text').value.trim();
  if(!txt){ toast('写点什么再发布吧','bad'); return; }
  const u=me(), posts=getPosts();
  posts.unshift({id:'p'+Date.now(),name:u.name,avatar:u.avatar,tag:cTag,text:txt,ts:Date.now(),likes:0,likedBy:[],comments:[]});
  savePosts(posts);
  const p=P(); p.community.posted=true; saveP();
  EL('c-text').value='';
  toast('发布成功！+10 XP','ok','🎉'); addXP(10,'社区发言');
  renderView();
}
function toggleLike(id){
  const u=me(), posts=getPosts();
  const p=posts.find(x=>x.id===id); if(!p) return;
  const i=p.likedBy.indexOf(u.uid);
  if(i>=0){ p.likedBy.splice(i,1); p.likes=Math.max(0,p.likes-1); }
  else{
    p.likedBy.push(u.uid); p.likes++;
    if(!P().community.liked){ P().community.liked=true; saveP(); }
    checkBadges();
  }
  savePosts(posts); renderView();
}
function focusComment(id){ const el=EL('ci-'+id); if(el){ el.focus(); el.scrollIntoView({block:'center'}); } }
function commentPost(id){
  const input=EL('ci-'+id), txt=input.value.trim();
  if(!txt){ toast('评论不能为空','bad'); return; }
  const u=me(), posts=getPosts();
  const p=posts.find(x=>x.id===id); if(!p) return;
  p.comments.push({name:u.name,avatar:u.avatar,text:txt});
  savePosts(posts);
  toast('评论成功 +5 XP','ok'); addXP(5,'社区评论');
  renderView(); setTimeout(()=>focusComment(id),50);
}

/* ================= 成就殿堂 ================= */
function checkBadges(){
  const p=P();
  const conds={
    welcome:()=>true,
    first_lesson:()=>lessonsDoneCount()>=1,
    streak3:()=>p.streak.c>=3,
    streak7:()=>p.streak.c>=7,
    vocab50:()=>wordsLearned()>=50,
    grammar_ace:()=>Object.values(p.lessons).some(l=>l.grammar===100),
    speak_first:()=>p.stats.speak.a>0,
    listen_ear:()=>Object.values(p.lessons).some(l=>l.listen===100),
    lesson5:()=>lessonsDoneCount()>=5,
    community:()=>p.community.posted,
    like_giver:()=>p.community.liked,
    level5:()=>levelOf(p.xp)>=5,
    polyglot:()=>LKEYS.filter(lg=>Object.keys(p.lessons).some(lid=>lid.startsWith(lg))).length>=2
  };
  BADGES.forEach(b=>{
    if(!p.badges[b.id]&&conds[b.id]&&conds[b.id]()){
      p.badges[b.id]=Date.now(); saveP();
      toast('解锁成就「'+b.name+'」'+b.icon,'gold','🏆');
    }
  });
}
function renderAchievements(){
  const p=P(), u=me();
  const mine={name:u.name,avatar:u.avatar,xp:p.xp,isMe:true};
  const all=[...LEADERS.map(l=>({...l})),mine].sort((a,b)=>b.xp-a.xp);
  const unlocked=Object.keys(p.badges).length;
  return `
  <div class="hero-banner" style="margin-bottom:18px;background:linear-gradient(120deg,#f59e0b,#f97316 60%,#ec4899)">
    <div><h2>🏆 成就殿堂</h2><p>已解锁 ${unlocked} / ${BADGES.length} 个成就 · 当前等级 Lv.${levelOf(p.xp)}</p></div>
    <div style="text-align:center">${ringSvg(unlocked/BADGES.length)}<div class="small" style="margin-top:8px;opacity:.9">收集进度</div></div>
  </div>
  <div class="bd-grid" style="margin-bottom:20px">
    ${BADGES.map(b=>{ const on=!!p.badges[b.id];
      return `<div class="bd ${on?'on':''}">
        <div class="bd-icon">${b.icon}</div>
        <div class="bd-name">${b.name}</div>
        <div class="bd-desc">${b.desc}</div>
        ${on?'<div class="small" style="color:var(--warn);margin-top:6px">'+timeAgo(p.badges[b.id])+'获得</div>':'<div class="small muted" style="margin-top:6px">🔒 未解锁</div>'}
      </div>`; }).join('')}
  </div>
  <div class="card">
    <div class="card-h"><div class="t">🔥 学霸排行榜</div><span class="small muted">按累计 XP 排名</span></div>
    ${all.map((l,i)=>`<div class="lb-row" style="${l.isMe?'background:#f4f2ff;border-radius:12px':''}">
      <div class="lb-rank r${i+1}">${i+1<=3?['🥇','🥈','🥉'][i]:i+1}</div>
      <div class="p-ava" style="width:36px;height:36px;font-size:18px">${l.avatar}</div>
      <div style="flex:1;font-weight:700;font-size:14px">${esc(l.name)}${l.isMe?' <span class="tag" style="background:var(--p1);color:#fff">我</span>':''}</div>
      <div class="small muted">Lv.${levelOf(l.xp)}</div>
      <div style="font-weight:800;font-size:14px;color:var(--p1);width:90px;text-align:right">⚡ ${l.xp} XP</div>
    </div>`).join('')}
  </div>`;
}

/* ================= 个人中心 ================= */
function renderProfile(){
  const u=me(), p=P(), lv=levelOf(p.xp), nxt=nextLevelXp(p.xp), prev=LEVEL_T[lv-1]||0;
  return `
  <div class="card" style="margin-bottom:18px;display:flex;gap:20px;align-items:center;flex-wrap:wrap">
    <div class="p-ava" style="width:76px;height:76px;font-size:38px">${u.avatar}</div>
    <div style="flex:1;min-width:220px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span style="font-size:20px;font-weight:800">${esc(u.name)}</span>
        <span class="tag" style="background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff">Lv.${lv}</span></div>
      <div class="small muted" style="margin:6px 0 10px">${u.email} · ${timeAgo(u.created)}加入 · 已连续学习 ${p.streak.c} 天</div>
      <div style="display:flex;align-items:center;gap:12px">
        <div style="flex:1"><div class="bar" style="height:10px"><div class="bar-i" style="width:${pct(p.xp-prev,nxt-prev)}%"></div></div></div>
        <span class="small muted">${p.xp}/${nxt} XP</span>
      </div>
    </div>
  </div>
  <div class="grid2">
    <div class="card">
      <div class="card-h"><div class="t">🎯 学习偏好</div></div>
      <div class="field"><label>每日 XP 目标</label><div class="chips">
        ${GOALS.map(g=>`<span class="chip ${p.goal===g?'on':''}" onclick="setGoal(${g})">${g} XP</span>`).join('')}
      </div></div>
      <div class="field" style="margin-bottom:0"><label>在学习语言</label><div class="chips">
        ${LKEYS.map(k=>`<span class="chip ${(u.langs||[]).includes(k)?'on':''}" onclick="toggleLang('${k}')">${LANGS[k].flag} ${LANGS[k].name}</span>`).join('')}
      </div></div>
      <div class="divider"></div>
      <label style="font-size:13px;font-weight:600">更换头像</label>
      <div class="ava-row" style="margin-top:8px">
        ${AVATARS.map(a=>`<div class="ava-pick ${a===u.avatar?'on':''}" onclick="setAvatar('${a}')">${a}</div>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-h"><div class="t">📐 能力定级</div></div>
      ${LKEYS.map(k=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)">
        <span style="font-weight:600;font-size:14px">${LANGS[k].flag} ${LANGS[k].name}</span>
        <span style="display:flex;gap:8px;align-items:center">
          <span class="small muted">${p.placement[k]!==undefined?'已定级：'+LANGS[k].levels[p.placement[k]].label:'未测试'}</span>
          <button class="btn ghost sm" onclick="openPlacement('${k}')">${p.placement[k]!==undefined?'重测':'测试'}</button>
        </span></div>`).join('')}
      <div class="divider"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn soft" onclick="resetProgress()">🔄 重置学习进度</button>
        <button class="btn danger" onclick="logout()">🚪 退出登录</button>
      </div>
      <div class="small muted" style="margin-top:12px">重置仅清空学习数据（课程进度、XP、成就），账号保留。</div>
    </div>
  </div>`;
}
function bindProfile(){}
function setGoal(g){ P().goal=g; saveP(); toast('每日目标已设为 '+g+' XP','ok'); renderView(); }
function toggleLang(k){
  const u=me();
  u.langs=u.langs||[];
  if(u.langs.includes(k)){ if(u.langs.length>1) u.langs=u.langs.filter(x=>x!==k); else { toast('至少保留一门语言','bad'); return; } }
  else u.langs.push(k);
  saveMe(); toast('已更新学习语言','ok'); renderView();
}
function setAvatar(a){ me().avatar=a; saveMe(); toast('头像已更新','ok','✨'); renderView(); }
function resetProgress(){
  openModal(`<div style="text-align:center;padding:8px 0">
    <div style="font-size:44px">⚠️</div>
    <h3 style="margin:12px 0 8px">确认重置学习进度？</h3>
    <p class="muted small" style="margin-bottom:20px">课程进度、XP、成就、复习计划将全部清空，此操作不可恢复。</p>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn danger" onclick="doReset()">确认重置</button>
    </div></div>`);
}
function doReset(){
  DB.set('prog_'+me().uid,newProgress());
  _p=null; ensureProgress(); closeModal();
  toast('学习进度已重置'); go('dashboard');
}

/* ================= 启动 ================= */
function boot(){
  ensureDemoUser();
  const sid=DB.get('session',null);
  if(sid){
    const users=DB.get('users',{});
    const u=Object.values(users).find(x=>x.uid===sid);
    if(u){ _me=u; ensureProgress(); checkBadges(); enterApp(); return; }
  }
  renderAuth('login');
}
boot();
</script>
